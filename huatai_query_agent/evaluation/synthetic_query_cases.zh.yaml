  - id: "s029"
    category: "transaction_fee"
    scenario: "费用分析"
    difficulty: "中等"
    question: "2026年一季度交易佣金和费用按产品一级、二级分类排名，取费用最高的前20类。"
    required_tables: ["dwd_cust_tran_d", "dim_product"]
    expected_metrics: ["total_rake", "total_fare", "total_fee"]
    sql: |
      select
          prdt.up_prdt_type_name,
          prdt.prdt_type_name,
          sum(coalesce(tran.buy_rake, 0) + coalesce(tran.sell_rake, 0)) as total_rake,
          sum(coalesce(tran.buy_fare, 0) + coalesce(tran.sell_fare, 0)) as total_fare,
          sum(coalesce(tran.buy_rake, 0) + coalesce(tran.sell_rake, 0)
            + coalesce(tran.buy_fare, 0) + coalesce(tran.sell_fare, 0)) as total_fee
      from dwd_cust_tran_d tran
      inner join dim_product prdt
        on tran.prdt_id = prdt.prdt_id
      where tran.data_dt between '20260101' and '20260331'
      group by prdt.up_prdt_type_name, prdt.prdt_type_name
      having total_fee > 0
      order by total_fee desc
      limit 20


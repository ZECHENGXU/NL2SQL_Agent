  - id: "s025"
    category: "fund_flow_asset"
    scenario: "资金流出客户筛选"
    difficulty: "complex"
    question: "找出2026年一季度净流出超过10万元且3月31日期末总资产低于10万元的客户。"
    required_tables: ["dws_cust_fin_d", "dws_cust_aset_d"]
    expected_metrics: ["net_outflow", "end_total_asset"]
    sql: |
      with flow_by_customer as (
          select
              pty_id,
              sum(coalesce(cash_out, 0) + coalesce(tran_out, 0) + coalesce(assign_out, 0)
                - coalesce(cash_in, 0) - coalesce(tran_in, 0) - coalesce(assign_in, 0)) as net_outflow
          from dws_cust_fin_d
          where data_dt between '20260101' and '20260331'
          group by pty_id
      )
      select
          flow.pty_id,
          flow.net_outflow,
          coalesce(aset.nm_tot_aset, 0) + coalesce(aset.fc_pur_aset, 0) as end_total_asset
      from flow_by_customer flow
      inner join dws_cust_aset_d aset
        on flow.pty_id = aset.pty_id
       and aset.data_dt = '20260331'
      where flow.net_outflow > 100000
        and coalesce(aset.nm_tot_aset, 0) + coalesce(aset.fc_pur_aset, 0) < 100000
      order by flow.net_outflow desc
      limit 20

  - id: "s026"
    category: "holding_analysis"
    scenario: "高资产客户持仓"
    difficulty: "complex"
    question: "2026年一季度日均总资产超过30万元的客户，在3月31日持仓的产品一级分类分布如何？"
    required_tables: ["dws_cust_aset_d", "dwd_cust_hold_d", "dim_product"]
    expected_metrics: ["customer_count", "product_count", "total_market_value"]
    sql: |
      with high_asset as (
          select
              pty_id,
              sum(coalesce(nm_tot_aset, 0) + coalesce(fc_pur_aset, 0)) / 90.0 as avg_daily_asset
          from dws_cust_aset_d
          where data_dt between '20260101' and '20260331'
          group by pty_id
          having sum(coalesce(nm_tot_aset, 0) + coalesce(fc_pur_aset, 0)) / 90.0 > 300000
      )
      select
          prdt.up_prdt_type_name,
          count(distinct hold.pty_id) as customer_count,
          count(distinct hold.prdt_id) as product_count,
          sum(coalesce(hold.mkt_val, 0)) as total_market_value
      from high_asset asset
      inner join dwd_cust_hold_d hold
        on asset.pty_id = hold.pty_id
       and hold.data_dt = '20260331'
      inner join dim_product prdt
        on hold.prdt_id = prdt.prdt_id
      group by prdt.up_prdt_type_name
      order by total_market_value desc

  - id: "s027"
    category: "branch_profile"
    scenario: "营业部客户画像"
    difficulty: "简单"
    question: "客户数最多的前10个营业部，分别有多少客户、平均年龄是多少？"
    required_tables: ["ads_cust_info_d", "dim_branch"]
    expected_metrics: ["customer_count", "avg_age"]
    sql: |
      select
          branch.up_org_name,
          branch.org_name,
          count(*) as customer_count,
          avg(cust.cust_age) as avg_age
      from ads_cust_info_d cust
      left join dim_branch branch
        on cust.org_id = branch.org_id
      where cust.data_dt = '20260531'
      group by branch.up_org_name, branch.org_name
      order by customer_count desc, avg_age desc
      limit 10

